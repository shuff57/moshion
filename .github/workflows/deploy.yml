name: Deploy (moshion.lefthanddev.com and GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

  # The public site, moshion.lefthanddev.com: the Cloudflare Pages project
  # `moshion` (made with wrangler, so it deploys from here rather than from a
  # Git connection). Needs the repo secrets CLOUDFLARE_API_TOKEN (Cloudflare
  # Pages: Edit) and CLOUDFLARE_ACCOUNT_ID. _headers gives every file
  # access-control-allow-origin: *, which the sandboxed runner needs.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name moshion --branch main --commit-dirty=true
